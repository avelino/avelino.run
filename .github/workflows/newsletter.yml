name: Newsletter on new post

on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only log what would be sent (no broadcast is created)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

# Never run two sends at the same time (avoids duplicate broadcasts).
concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send-broadcast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch full history to ensure we can diff properly
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci || npm i --legacy-peer-deps || npm i
          else
            npm init -y
            npm i resend gray-matter --legacy-peer-deps
          fi
      - name: Send newsletter broadcast
        run: node .github/scripts/send_newsletter.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_BASE_SHA: ${{ github.event.before }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
          SITE_NAME: avelino.run
          # Only contacts in this Resend Segment receive the email.
          RESEND_SEGMENT_NAME: ${{ vars.RESEND_SEGMENT_NAME || 'news.avelino.run' }}
          RESEND_SEGMENT_ID: ${{ vars.RESEND_SEGMENT_ID }}
          # Blast guards: posts older than this are never emailed, and at most N per run.
          NEWSLETTER_MAX_AGE_DAYS: ${{ vars.NEWSLETTER_MAX_AGE_DAYS || '7' }}
          NEWSLETTER_MAX_PER_RUN: ${{ vars.NEWSLETTER_MAX_PER_RUN || '1' }}
          NEWSLETTER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
      - name: Commit newsletter state
        # Runs even if a later post failed, so posts already sent are recorded and never re-sent.
        if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if [ ! -f .newsletter_state.json ]; then
            echo "Warning: .newsletter_state.json not found"
            exit 0
          fi
          git add .newsletter_state.json
          if git diff --staged --quiet; then
            echo "No changes in newsletter state to commit"
            exit 0
          fi
          git commit -m "update newsletter state [skip ci]"
          git pull --rebase origin main
          git push origin main
